<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Velocità delle guide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d5f7d'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1' fill='white'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='white'/%3E%3C/svg%3E">
<style>
:root{
 --bg:#f6efe4;--paper:#fffdf9;--ink:#231d18;--mute:#6f645a;--faint:#a99d8f;--line:#e8ddcc;
 --terra:#3d5f7d;--terra-soft:#e4ecf3;--on:#fff;
 --good:#2f7a47;--good-soft:#e3f1e7;--warn:#9a6a12;--warn-soft:#f8eed8;--bad:#a8442f;--bad-soft:#f7e4df;
 --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#161311;--paper:#201c19;--ink:#f1e9df;--mute:#ab9f92;--faint:#7d7268;--line:#332d28;
 --terra:#8fb3d3;--terra-soft:#1f2a35;--on:#102131;
 --good:#6fbf86;--good-soft:#1c2a20;--warn:#e0b25a;--warn-soft:#2d2516;--bad:#e8876f;--bad-soft:#321d18;--shadow:none}}
:root[data-theme="dark"]{
 --bg:#161311;--paper:#201c19;--ink:#f1e9df;--mute:#ab9f92;--faint:#7d7268;--line:#332d28;
 --terra:#8fb3d3;--terra-soft:#1f2a35;--on:#102131;
 --good:#6fbf86;--good-soft:#1c2a20;--warn:#e0b25a;--warn-soft:#2d2516;--bad:#e8876f;--bad-soft:#321d18;--shadow:none}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,a{-webkit-tap-highlight-color:transparent}
a{color:var(--terra)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 40px}
header{padding:26px 0 8px}
.kick{display:flex;align-items:center;gap:10px;color:var(--terra);font-weight:700;font-size:14px;text-decoration:none}
.kick svg{width:22px;height:22px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.08;margin:10px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px var(--sans);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--terra);border-color:var(--terra);color:var(--on)}
.btn:disabled{opacity:.6;cursor:default}
.btn svg{width:17px;height:17px;flex:none}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
.when{font-size:14px;color:var(--mute);margin:6px 0 0}
section{margin-top:26px}
h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:0 0 10px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* velocita */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tabs a{display:inline-flex;align-items:center;height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;text-decoration:none}
.tabs a.on{background:var(--terra);border-color:var(--terra);color:var(--on)}
.voto{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.verde{background:var(--good-soft);color:var(--good)}.giallo{background:var(--warn-soft);color:var(--warn)}.rosso{background:var(--bad-soft);color:var(--bad)}.grigio{background:var(--line);color:var(--mute)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;padding:14px}
.big div{background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
.big b{display:block;font:600 1.7rem/1.1 var(--serif)}
.big span{color:var(--mute);font-size:13.5px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{border-top:0;color:var(--mute);font-weight:600;font-size:13px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px 4px}
.ph h3{margin:0;font:600 1.15rem var(--serif)}
.nota{color:var(--mute);font-size:14px;margin:8px 0 0}
.leg{color:var(--mute);font-size:13.5px;padding:4px 16px 14px;margin:0}
svg.spark{width:100%;height:120px;display:block}
.box{padding:16px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <a class="kick" href="./statistiche.html">← Statistiche</a>
 <h1 id="tit">Velocità delle guide</h1>
 <p class="sub">Le pagine vere dei siti, aperte da GitHub ogni mattina come le apre una persona: telefono con 4G e processore 4 volte più lento di un iPhone, poi rete lenta, seconda visita, computer e tocchi.</p>
 <nav class="tabs" id="tabs"></nav>
 <div class="tools">
  <a class="btn primary" id="rifai" target="_blank" rel="noopener" href="https://github.com/drdonatistefano-cmyk/eventi-bologna/actions/workflows/velocita.yml">Rifai il controllo adesso</a>
  <button class="btn" id="ricarica" type="button">Ricarica i risultati</button>
 </div>
 <p class="when" id="when">Lettura dei risultati…</p>
</header>
<main id="out"></main>
</div>
<script>
const REPO="drdonatistefano-cmyk/eventi-bologna";
const NOMI={places:"Places",dinners:"Dinners",events:"Events"};
const PAG={guida:"La guida",mappa:"La mappa"};
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("it-IT");
const sec=ms=>ms==null?"—":(ms<1000?nf.format(ms)+" ms":nf.format(Math.round(ms/100)/10)+" s");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAROLA={verde:"Veloce",giallo:"Da migliorare",rosso:"Lento",grigio:"Senza dati"};
const voto=v=>`<span class="voto ${v||"grigio"}">${PAROLA[v||"grigio"]}</span>`;
let G=new URLSearchParams(location.search).get("guida")||"places";if(!NOMI[G])G="places";
function tabs(){$("tabs").innerHTML=Object.entries(NOMI).map(([k,n])=>`<a href="?guida=${k}" class="${k===G?"on":""}">${n}</a>`).join("");}
async function leggi(f){const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${f}?ref=statistiche&t=${Date.now()}`,{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"});if(!r.ok)throw new Error(r.status);return f.endsWith(".json")?r.json():r.text();}
function voti(ms,v,g){return ms==null?"grigio":ms<=v?"verde":ms<=g?"giallo":"rosso";}
function pagina(nome,v){
 const a=v["prima visita 4G"]||{},b=v["prima visita 3G"]||{},r=v.ritorno||{},pc=v.pc||{},u=v.uso||{},gz=v.giudizio||{};
 const righe=[["Primo disegno","primo_disegno",1000,2500],["Schede visibili","contenuto",1500,3000],["Foto visibili","foto",2500,4000],["Dati arrivati","dati",2500,5000],["Blocco totale (TBT)","tbt",200,600],["Blocco più lungo","blocco_max",100,300]];
 const col=[["4G, prima volta",a],["3G, prima volta",b],["Ritorno",r],["Computer",pc]];
 const tab=`<div class="tw"><table><thead><tr><th></th>${col.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${righe.filter(([,k])=>col.some(c=>c[1][k]!=null)).map(([t,k,ve,gi])=>`<tr><td>${t}</td>${col.map(c=>`<td>${c[1][k]==null?"—":`<span class="voto ${voti(c[1][k],ve,gi)}">${k==="tbt"||k==="blocco_max"?nf.format(c[1][k])+" ms":sec(c[1][k])}</span>`}</td>`).join("")}</tr>`).join("")}<tr><td>Scaricato</td>${col.map(c=>`<td>${c[1].kb==null?"—":nf.format(c[1].kb)+" KB"}</td>`).join("")}</tr></tbody></table></div>`;
 const toc=Object.entries(u).filter(([k,x])=>x&&typeof x==="object");
 const tt=toc.length?`<div class="tw"><table><thead><tr><th>Tocco</th><th>Risposta</th><th>Blocco più lungo</th></tr></thead><tbody>${toc.map(([k,x])=>x.errore?`<tr><td>${esc(k)}</td><td colspan="2">non provato (${esc(x.errore)})</td></tr>`:`<tr><td>${esc(k)}</td><td><span class="voto ${voti(x.risposta,200,500)}">${nf.format(x.risposta)} ms</span></td><td>${nf.format(x.blocco_max)} ms</td></tr>`).join("")}</tbody></table></div>`:"";
 return `<section><div class="panel"><div class="ph"><h3>${PAG[nome]||nome}</h3>${voto(gz.insieme)}</div>
  <div class="big"><div><b>${sec(a.contenuto)}</b><span>schede visibili, 4G</span></div>${a.foto!=null?`<div><b>${sec(a.foto)}</b><span>foto visibili, 4G</span></div>`:""}<div><b>${a.tbt==null?"—":nf.format(a.tbt)+" ms"}</b><span>blocco totale, 4G</span></div><div><b>${toc.length?nf.format(Math.max(...toc.filter(([,x])=>x.risposta!=null).map(([,x])=>x.risposta)))+" ms":"—"}</b><span>tocco più lento</span></div></div>
  ${tab}<p class="leg">${(a.giri||1)>1?`Colonna 4G: mediana di ${a.giri} aperture`:"Colonna 4G: una apertura"}; le altre colonne: una apertura ciascuna. «Ritorno» = seconda visita dallo stesso telefono.</p>
  ${tt?`<div class="ph"><h3>Tocchi</h3></div>${tt}<p class="leg">Tempo tra il tocco e la risposta sullo schermo, con il processore lento. Sotto 200 ms sembra immediato.</p>`:""}</div></section>`;}
function storico(csv,g){
 const L=csv.trim().split("\n").slice(1).map(r=>r.split(",")).filter(r=>r[1]===g);if(L.length<2)return "";
 const pag=[...new Set(L.map(r=>r[2]))];const W=640,H=120,P=28;
 const xs=[...new Set(L.map(r=>r[0]))].sort();const max=Math.max(1500,...L.map(r=>+r[3]||0));
 const X=d=>P+(W-2*P)*(xs.indexOf(d)/Math.max(1,xs.length-1)),Y=v=>H-18-(H-30)*(v/max);
 const lin=pag.map((p,i)=>{const pts=L.filter(r=>r[2]===p&&r[3]).map(r=>`${X(r[0]).toFixed(1)},${Y(+r[3]).toFixed(1)}`).join(" ");return `<polyline points="${pts}" fill="none" stroke="${i?"var(--warn)":"var(--terra)"}" stroke-width="2.2"/>`;}).join("");
 const soglia=`<line x1="${P}" x2="${W-P}" y1="${Y(1500)}" y2="${Y(1500)}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W-P}" y="${Y(1500)-4}" text-anchor="end" font-size="11" fill="var(--good)">1,5 s</text>`;
 return `<section><div class="panel"><div class="ph"><h3>Come cambia giorno per giorno</h3></div><div class="box"><svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schede visibili con il 4G, giorno per giorno">${soglia}${lin}<text x="${P}" y="${H-3}" font-size="11" fill="var(--mute)">${xs[0]}</text><text x="${W-P}" y="${H-3}" text-anchor="end" font-size="11" fill="var(--mute)">${xs[xs.length-1]}</text></svg>
  <p class="nota">Schede visibili con il 4G alla prima visita${pag.length>1?`: <b style="color:var(--terra)">${PAG[pag[0]]||pag[0]}</b>, <b style="color:var(--warn)">${PAG[pag[1]]||pag[1]}</b>`:""}.</p></div></div></section>`;}
async function vai(){
 tabs();document.title=`Velocità di ${NOMI[G]}`;$("tit").textContent=`Velocità di ${NOMI[G]}`;$("when").textContent="Lettura dei risultati…";
 try{const R=await leggi("velocita.json");const g=R.guide&&R.guide[G];
  if(!g){$("out").innerHTML=`<section><div class="panel box"><b>Primo controllo in arrivo.</b><p class="nota">GitHub controlla le tre guide ogni mattina. Per averlo subito premi «Rifai il controllo adesso», poi «Run workflow»: dopo una decina di minuti premi «Ricarica i risultati».</p></div></section>`;$("when").textContent="";return;}
  const d=new Date(g.aggiornato);$("when").textContent=`Controllo del ${d.toLocaleDateString("it-IT",{day:"numeric",month:"long"})} alle ${d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})} su ${g.sito}`;
  let h=Object.entries(g.pagine).map(([k,v])=>pagina(k,v)).join("");
  try{h+=storico(await leggi("velocita_storico.csv"),G);}catch(e){}
  $("out").innerHTML=h;
 }catch(e){$("out").innerHTML=`<section><div class="panel box"><b>Risultati non ancora disponibili.</b><p class="nota">Il primo controllo non è ancora stato salvato, oppure GitHub non risponde. Premi «Rifai il controllo adesso», poi «Run workflow»; dopo una decina di minuti premi «Ricarica i risultati».</p></div></section>`;$("when").textContent="";}}
$("ricarica").onclick=vai;
vai();
</script>
</body>
</html>

name: Sonda fonte serate
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="AchEventsGuide/1.0 (+https://achevents.com)"
          curl -sSL -A "$UA" https://www.technoairlines.com/robots.txt -o out/robots.txt || true
          curl -sSL -A "$UA" https://www.technoairlines.com/events/bologna/2026-11 -o out/bo-2026-11.html || true
          curl -sSL -A "$UA" https://www.technoairlines.com/events/milan/2026-11 -o out/mi-2026-11.html || true
          curl -sSL -A "$UA" https://www.technoairlines.com/event/bunker-damore-ex-dynamo-2026-11-28 -o out/ev.html || true
          curl -sSL -A "$UA" "https://www.technoairlines.com/sitemap.xml" -o out/sitemap.xml || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: sonda, path: out }

name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g lv.html "https://www.legavolley.it/calendario/"
          g lvf_a2.html "https://www.legavolleyfemminile.it/calendario/?campionato=a2"
          curl -sSL -m 30 -A "$UA" https://www.legabasket.it/calendario -o lba.html
          for c in $(grep -o '/_next/static/immutable/chunks/[^"]*\.js' lba.html | sort -u); do curl -sSL -m 20 "https://www.legabasket.it$c" >> out/lba_all.js; echo >> out/lba_all.js; done
          g bfc_tk.html "https://www.bolognafc.it/biglietteria/"
          g virtus_tk.html "https://www.virtus.it/biglietteria/"
          g oli_tk.html "https://www.olimpiamilano.com/biglietteria/"
          g inter_tk.html "https://www.inter.it/it/biglietteria"
          g milan_tk.html "https://www.acmilan.com/it/biglietti"
          g vero_tk.html "https://www.verovolley.com/biglietteria/"
          g pvm.html "https://www.powervolleymilano.it/"
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

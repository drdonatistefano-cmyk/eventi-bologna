name: Sonda (prove temporanee)
# Regola 9 (coordinamento/REGOLE.md): ogni comando chiude con «|| true» e il lavoro non fallisce mai, così non arrivano email.
# Da togliere quando le prove sono finite.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      SOLO_CITTA: "ra,fe"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/sonda_locali.py || true

name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g ml11.html "https://www.mentelocale.it/milano/eventi/arg/11/"
          g ml5.html "https://www.mentelocale.it/milano/eventi/arg/5/"
          g ml11b.html "https://www.mentelocale.it/milano/eventi/arg/11/2/"
          g mlev.html "https://www.mentelocale.it/milano/146478-bookcity-milano-2026-iniziative-e-incontri-al-museo-nazionale-scienza-e-tecnologia-ospite-samantha-cristoforetti.htm"
          g bc_day.html "https://www.bookcitymilano.it/eventi?day=24-novembre"
          curl -sS -m 60 -A "$UA" -X POST "https://www.bookcitymilano.it/eventi" -H "X-OCTOBER-REQUEST-HANDLER: onSearchResults" -H "X-OCTOBER-REQUEST-PARTIALS: " -H "X-Requested-With: XMLHttpRequest" --data "day=24-novembre&zone=tutte&search=&arguments[]=tutti&apiSearch=true" -o out/bc_ajax.json -w "bc_ajax %{http_code} %{size_download}\n" >> out/codici.txt
          curl -sS -m 90 -A "$UA" -X POST "https://www.bookcitymilano.it/eventi" -H "X-OCTOBER-REQUEST-HANDLER: onLoadMore" -H "X-Requested-With: XMLHttpRequest" --data "limit=400&logged=false" -o out/bc_more.json -w "bc_more %{http_code} %{size_download}\n" >> out/codici.txt
          g bc_one.html "https://www.bookcitymilano.it/eventi/2026/consumi-culturali-e-consumi-bibliotecari-a-milano"
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

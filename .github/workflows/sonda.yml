name: Sonda fonti
# Regola 9 (coordinamento/REGOLE.md): una sonda non fallisce mai, ogni comando chiude con || true
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          mkdir out || true; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g fxd.json "https://fixturedownload.com/feed/json/serie-a-2026" || true
          g fxd_r.txt "https://fixturedownload.com/robots.txt" || true
          g lsa.html "https://www.legaseriea.it/it/serie-a/calendario-e-risultati" || true
          grep -o 'https://[a-z0-9.-]*legaseriea[a-z0-9./_-]*' out/lsa.html | sort -u > out/lsa_urls.txt || true
          g acm_cal.html "https://www.acmilan.com/it/stagione/calendario/prima-squadra-maschile" || true
          python3 -c "import re;t=open('out/acm_cal.html').read();open('out/acm_next.txt','w').write('\n'.join(re.findall(r'self.__next_f.push\((.*?)\)</script>',t,re.S)))" || true
          g bfc_m.html "https://www.bolognafc.it/match/bologna-palermo/" || true
          python3 - <<'PY' || true
          import re,glob
          for f in glob.glob("out/*"):
              try: t=open(f,encoding="utf-8",errors="ignore").read()
              except Exception: continue
              t=re.sub(r'(?is)<script(?![^>]*(ld\+json|__NEXT_DATA__))[^>]*>.*?</script>','<script></script>',t)
              t=re.sub(r'AIza[0-9A-Za-z_\-]{20,}|(pk|sk)\.ey[0-9A-Za-z_\-.]+|gh[pousr]_[0-9A-Za-z]{20,}|xox[abp]-[0-9A-Za-z-]+|[0-9a-f]{32,}','<tolto>',t)
              open(f,"w",encoding="utf-8").write(t)
          PY
          cd out && git init -q && git checkout -q -b sonda && git add -A || true
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda || true

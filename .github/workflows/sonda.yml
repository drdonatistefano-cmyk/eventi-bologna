name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g bc.html "https://bookcitymilano.it/"
          g bc_ev.html "https://bookcitymilano.it/eventi"
          g bc_pr.html "https://bookcitymilano.it/programma"
          g ml_r.txt "https://www.mentelocale.it/robots.txt"
          g ml.html "https://www.mentelocale.it/milano/eventi/"
          g eb_r.txt "https://www.eventbrite.it/robots.txt"
          g eb.html "https://www.eventbrite.it/d/italy--milano/talks/"
          g ckan.json "https://dati.comune.milano.it/api/3/action/package_search?q=eventi&rows=20"
          g tri_api.json "https://triennale.org/wp-json/wp/v2/events?per_page=5"
          g tri_r.txt "https://triennale.org/robots.txt"
          g lf_api.html "https://www.lafeltrinelli.it/eventi"
          g md.html "https://www.mondadoristore.it/eventi/"
          g fcs.html "https://fondazione.corriere.it/eventi/"
          g fcs_r.txt "https://fondazione.corriere.it/robots.txt"
          g par.html "https://www.teatrofrancoparenti.it/"
          g ver.html "https://www.libreriaverso.com/eventi/"
          g uni.html "https://www.unimi.it/it/eventi"
          g uni_r.txt "https://www.unimi.it/robots.txt"
          g mudec.html "https://www.mudec.it/eventi/"
          g mudec_r.txt "https://www.mudec.it/robots.txt"
          g fpr.html "https://www.fondazioneprada.org/visit/"
          g pac.html "https://www.palazzorealemilano.it/eventi"
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

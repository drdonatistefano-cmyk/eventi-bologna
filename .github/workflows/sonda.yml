name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          for s in www.ticketone.it www.bolognawelcome.com www.yesmilano.it zero.eu www.arte.it iltaccodibacco.it www.bolognatoday.it www.milanotoday.it www.livenation.it www.ticketmaster.it www.dice.fm ra.co www.bandsintown.com www.vivaticket.com www.mailticket.it www.boxofficelive.it; do g "rb_$s.txt" "https://$s/robots.txt"; done
          g arte_bo.html https://www.arte.it/calendario-arte/bologna/2026/11/
          g arte_mi.html https://www.arte.it/calendario-arte/milano/2026/11/
          g bw.html "https://www.bolognawelcome.com/it/eventi"
          g zero_bo.html "https://zero.eu/it/bologna/eventi/"
          g yes.html "https://www.yesmilano.it/eventi"
          g t1_city.html "https://www.ticketone.it/city/bologna-218/"
          g dice_bo.html "https://dice.fm/browse/bologna"
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

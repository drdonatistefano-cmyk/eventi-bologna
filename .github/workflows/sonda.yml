name: Sonda fonti
# Regola 9 (coordinamento/REGOLE.md): una sonda non fallisce mai, ogni comando chiude con || true
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          mkdir out || true; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g fb_r.txt "https://fortitudobologna.it/robots.txt" || true
          g fb.html "https://fortitudobologna.it/calendario/" || true
          g fb_home.html "https://fortitudobologna.it/" || true
          g lnp_r.txt "https://www.legapallacanestro.com/robots.txt" || true
          g lnp.html "https://www.legapallacanestro.com/serie/4/calendario" || true
          g lnp_home.html "https://www.legapallacanestro.com/" || true
          g cev_r.txt "https://www.cev.eu/robots.txt" || true
          g cev.html "https://www.cev.eu/club/volleyball-champions-league/women/" || true
          g lvf_r2.html "https://www.legavolleyfemminile.it/coppa-italia/" || true
          g dc.html "https://www.daviscup.com/en/draws-results/final-8" || true
          grep -rl "pk\.ey\|sk\.ey" out | xargs -r rm -f || true
          cd out && git init -q && git checkout -q -b sonda && git add -A || true
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda || true

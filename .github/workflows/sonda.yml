name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g lba_cal.json "https://www.legabasket.it/api/championships/get-championships-calendar-by-id?id=602"
          g lba_teams.json "https://www.legabasket.it/api/teams/get-teams?championship_id=602"
          g lv2.html "https://www.legavolley.it/calendario/?IdCampionato=999&IdFase=2"
          g bfc_vt.html "https://bolognafc.vivaticket.it/"
          g vir_vt.html "https://virtus.vivaticket.it/"
          g oli_t.html "https://www.olimpiamilano.com/biglietti/"
          g fortitudo.html "https://www.fortitudopallacanestro.it/"
          grep -rl "pk\.ey\|sk\.ey" out | xargs -r rm -f
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

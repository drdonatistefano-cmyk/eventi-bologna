name: Sonda fonti
# Regola 9 (coordinamento/REGOLE.md): una sonda non fallisce mai, ogni comando chiude con || true
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          mkdir out || true; UA="Mozilla/5.0 (compatible; AchEventsGuide/1.0; +https://achevents.com)"
          g(){ curl -sSL -m 30 -A "$UA" "$2" -o "out/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> out/codici.txt || echo "$1 fail" >> out/codici.txt; }
          g inter_w.html "https://www.inter.it/it/matches?squadra=women&competizione=all&categoria=upcoming" || true
          g inter_m.html "https://www.inter.it/it/matches?squadra=men&competizione=all&categoria=upcoming" || true
          g lbf_r.txt "https://www.legabasketfemminile.it/robots.txt" || true
          g lbf.html "https://www.legabasketfemminile.it/calendario/" || true
          g lnp.html "https://www.legapallacanestro.com/serie/4/calendario" || true
          g fsa_r.txt "https://www.figc.it/robots.txt" || true
          g fsa.html "https://www.figc.it/it/femminile/serie-a-femminile/calendario-e-risultati/" || true
          g vw.html "https://www.virtus.it/femminile/" || true
          g euw.json "https://www.fiba.basketball/en/events/euroleague-women-26-27/games" || true
          g cev.html "https://www.cev.eu/club/champions-league/women/" || true
          g milm.html "https://www.milanomarathon.it/" || true
          g bom.html "https://www.bolognamarathon.run/" || true
          g lsa_ci.html "https://www.legaseriea.it/it/coppa-italia/calendario-e-risultati" || true
          grep -rl "pk\.ey\|sk\.ey" out | xargs -r rm -f || true
          cd out && git init -q && git checkout -q -b sonda && git add -A || true
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda || true

name: Sonda (prove temporanee)
# Regola 9 (coordinamento/REGOLE.md): ogni comando chiude con «|| true» e il lavoro non fallisce mai, così non arrivano email.
# Da togliere quando le prove sono finite.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/locali_sito.py --prova fe Pandurera || true
      - run: python3 -u scripts/locali_sito.py --prova fe Barattoni || true
      - run: curl -sS -A "Mozilla/5.0" https://www.sipariostellato.it/rassegna/la-stagione-serale-2027/ | grep -o 'href="[^"]*"' | sort -u | head -80 || true

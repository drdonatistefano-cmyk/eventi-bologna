name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    env:
      TK: ${{ secrets.TICKETMASTER_KEY }}
      AW: ${{ secrets.AWIN_FEED_URL }}
    steps:
      - run: |
          mkdir out
          echo "tk=${#TK} aw=${#AW}" > out/lunghezze.txt
          for c in Bologna Milano; do
            curl -sS "https://app.ticketmaster.com/discovery/v2/events.json?apikey=$TK&countryCode=IT&city=$c&size=200&sort=date,asc" -o out/tm_$c.json -w "$c %{http_code}\n" >> out/lunghezze.txt || true
          done
          if [ -n "$AW" ]; then curl -sS -L "$AW" -o out/aw.bin -w "aw %{http_code} %{size_download}\n" >> out/lunghezze.txt || true; rm -f out/aw.bin; fi
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

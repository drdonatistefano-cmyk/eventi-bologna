name: Sonda fonti
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          python3 scripts/incontri_auto.py bo --prova > out/bo.txt 2>&1 || true
          python3 scripts/incontri_auto.py mi --prova > out/mi.txt 2>&1 || true
          cd out && git init -q && git checkout -q -b sonda && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda

name: Posta della redazione
# Legge la casella redazione@achevents.com (Infomaniak). Solo a mano (Claude o Stefano).
# La password sta nel segreto REDAZIONE_PASSWORD. Il contenuto delle mail lette non va mai nei log
# né in chiaro nel repository: viene cifrato con dati/chiave_posta.pub e salvato sul ramo «posta».
# 16/11/2026: tolte le azioni «bozze» e «manda». In un repository pubblico i registri dei giri li vede
# chiunque, e le lettere passate come valore del flusso ci sarebbero finite in chiaro (REGOLE §8 quater.4).
# Bozze e invii si fanno solo da ristoranti-archivio, che è privato: file in posta/risposte/*.md approvato
# da Stefano, poi posta.yml con cosa = rispondi (strumenti/posta_rispondi.py, REGOLE §8 quinquies).
on:
  workflow_dispatch:
    inputs:
      giorni:
        description: "Quanti giorni indietro"
        default: "14"
permissions:
  contents: write
concurrency:
  group: posta
jobs:
  posta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDAZIONE_PASSWORD: ${{ secrets.REDAZIONE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Leggi
        env:
          GIORNI: ${{ inputs.giorni }}
        run: |
          case "$GIORNI" in ''|*[!0-9]*) echo "giorni deve essere un numero"; exit 1 ;; esac
          python3 scripts/posta.py leggi "$GIORNI"
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in posta.json -out posta.bin -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey dati/chiave_posta.pub -pkeyopt rsa_padding_mode:oaep -in k.bin -out chiave.bin
          shred -u posta.json k.bin
          mkdir -p /tmp/out && mv posta.bin chiave.bin /tmp/out/
          git config user.name "posta-bot"; git config user.email "actions@github.com"
          git checkout --orphan posta-tmp && git rm -rfq . && cp /tmp/out/* . && git add posta.bin chiave.bin
          git commit -qm "Posta cifrata $(date -u +%FT%TZ)" && git push -fq origin HEAD:posta

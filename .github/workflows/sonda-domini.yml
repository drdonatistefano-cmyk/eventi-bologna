name: Verifica domini (una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  domini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controllo .com (RDAP Verisign) e .it (whois NIC)
        run: |
          set +e
          sudo apt-get install -y -qq whois >/dev/null 2>&1
          mkdir -p sonda; : > sonda/nomi.txt
          for n in tonightout showtonight stagepass firstrow gigzy showzy eventzy nightoutnow outtonight letsgoout; do
            r=""
            for tld in app live events club co; do
              c=$(curl -s -L -o /dev/null -w "%{http_code}" "https://rdap.org/domain/$n.$tld" || echo ERR)
              [ "$c" = "404" ] && r="$r .$tld LIBERO" || r="$r .$tld preso($c)"
              sleep 1
            done
            echo "$n |$r" | tee -a sonda/nomi.txt
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "Verifica estensioni" && git pull --rebase && git push

name: Verifica domini (una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  domini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controllo
        run: |
          set +e
          sudo apt-get install -y -qq whois >/dev/null 2>&1
          mkdir -p sonda; : > sonda/nomi.txt
          for n in aguide achguide achsguide achevents achsevents achseventsguide acheventsguide achsevent achgo achout achnight achtonight achlive achpass achsguida achguida; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "https://rdap.verisign.com/com/v1/domain/$n.com"); [ "$c" = "404" ] && com=LIBERO || com=preso
            w=$(whois -h whois.nic.it "$n.it" 2>/dev/null | grep -m1 -i "^Status:" | awk '{print $2}'); [ "$w" = "AVAILABLE" ] && it=LIBERO || it=preso
            echo "$n | .com $com | .it $it" | tee -a sonda/nomi.txt
            sleep 1
          done
          for d in ach.events ach.guide achs.events ach.live a.guide; do
            c=$(curl -s -L -o /dev/null -w "%{http_code}" "https://rdap.org/domain/$d" || echo ERR); [ "$c" = "404" ] && s=LIBERO || s="preso($c)"
            echo "$d | $s" | tee -a sonda/nomi.txt; sleep 1
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "Verifica nomi ach" && git pull --rebase && git push

name: Verifica domini (una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  domini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroga RDAP
        run: |
          mkdir -p sonda
          for d in advisoryevents.com advisory-events.com advisoryevents.it advisory-events.it advisoryevents.eu advisoryevents.net advisoryevents.org advisoryevents.info advisoryevents.co advisoryevents.app advisory.events advisoryevent.com advisoryeventi.com advisoryeventi.it theadvisoryevents.com myadvisoryevents.com advisoryevents.club eventsadvisory.com eventadvisory.com eventadvisory.it eventiadvisory.it advisory.eventi; do
            c=$(curl -s -L -o /tmp/r.json -w "%{http_code}" "https://rdap.org/domain/$d")
            st=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(','.join(d.get('status',[]))[:60]+' | '+next((e.get('eventDate','')[:10] for e in d.get('events',[]) if e.get('eventAction')=='expiration'),''))" 2>/dev/null)
            echo "$d $c $st" | tee -a sonda/domini.txt
            sleep 1
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "Verifica domini" && git pull --rebase && git push

name: Verifica domini (una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  domini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controllo whois e DNS
        run: |
          set +e
          sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1
          mkdir -p sonda; : > sonda/whois.txt
          for d in advisoryevents.com advisory-events.com advisoryevents.it advisoryevents.eu advisoryevents.net advisoryeventi.it; do
            w=$(whois "$d" 2>&1 | grep -i -m3 -E "no match|not found|status:|available|domain name:|registrar:|expir" | tr '\n' ' ')
            ns=$(dig +short NS "$d" | tr '\n' ' ')
            echo "$d | whois: $w | NS: ${ns:-nessuno}" | tee -a sonda/whois.txt
            sleep 2
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "Verifica domini" && git pull --rebase && git push

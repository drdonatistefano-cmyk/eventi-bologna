name: sonda-biglietti
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (EventiBolognaBot)"
          for u in https://jolly.popupcinema.18tickets.it/ https://medica.popupcinema.18tickets.it/ https://bristol.popupcinema.18tickets.it/ https://nosadella.18tickets.it/ https://fossolo.18tickets.it/ https://bellinzona.18tickets.it/ https://www.cinemafossolo.it/ https://www.cinemabellinzona.it/ http://www.cinemabellinzona.it/ https://www.cineci.it/ https://www.cinemaastra.it/ https://www.cinemajollycsp.it/ https://www.cinemacristallo.it/ https://www.cinemakursaal.it/ https://cinemaincentro.com/ https://www.medicinateatro.it/; do
            c=$(curl -s -o /tmp/p.html -w "%{http_code} %{url_effective}" -L -A "$UA" --max-time 20 "$u" || echo ERR)
            echo "== $u -> $c"
            [ -f /tmp/p.html ] && grep -oiE 'https?://[a-z0-9.-]*(18tickets|webtic|vivaticket|boxol|liveticket|ciaotickets)[a-z0-9./_?=&-]*' /tmp/p.html | grep -v cdn | sort -u | head -8
            rm -f /tmp/p.html
          done
          echo "== STRUTTURA ccb"
          curl -s -L -A "$UA" https://ccb.18tickets.it/ | tr '\n' ' ' | grep -oE '.{0,300}/film/[0-9]+.{0,300}' | head -3

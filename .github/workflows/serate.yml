name: Serate nei club
on:
  schedule:
    - cron: "23 5 * * 1,4"   # lunedì e giovedì alle 6:23 ora italiana (inverno)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  serate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Leggi i calendari delle serate (Bologna e Milano)
        id: leggi
        run: python3 scripts/serate.py
        continue-on-error: true
      - name: Salva il risultato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/versioni.py
          git add serate.js milano/serate.js versioni.js milano/versioni.js 2>/dev/null || true
          git commit -m "Serate nei club $(date +%F)" || echo "nessuna modifica"
          git pull --rebase && git push
      - name: Segnala se la lettura non è riuscita
        if: steps.leggi.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue list --state open --search "Serate: lettura non riuscita in:title" --json number --jq '.[0].number' | grep -q . || \
          gh issue create --title "Serate: lettura non riuscita" --body "Lo script scripts/serate.py non è riuscito a leggere una o più pagine di technoairlines.com (vedi il log del flusso «Serate nei club»). Le serate già pubblicate restano finché non scadono."

name: Sonda cinema (prova una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine di prova
        run: |
          mkdir -p dati/sonda
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in "https://movieplayer.it/cinema/the-space-cinema-bologna_202/" "https://movieplayer.it/cinema/odeon_205/" "https://cinetecadibologna.it/programmazione/" "https://movieplayer.it/robots.txt" "https://cinetecadibologna.it/robots.txt" "https://movieplayer.it/cinema/bologna/san-lazzaro-di-savena/"; do
            n=$(echo "$u" | sed 's#https://##; s#[^a-zA-Z0-9]#_#g')
            code=$(curl -sS -L -A "$UA" -o "dati/sonda/$n.html" -w "%{http_code}" "$u" || echo ERR)
            echo "$code $(wc -c < dati/sonda/$n.html) $u" | tee -a dati/sonda/esito.txt
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/sonda && git commit -m "Sonda cinema" && git pull --rebase && git push

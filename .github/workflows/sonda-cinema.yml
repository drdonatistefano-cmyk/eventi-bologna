name: Sonda cinema (prova una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine di prova
        run: |
          rm -rf sonda; mkdir -p sonda
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in "https://www.mymovies.it/cinema/bologna/5565/" "https://www.mymovies.it/cinema/bologna/5454/" "https://www.thespacecinema.it/i-nostri-cinema/bologna/al-cinema"; do
            n=$(echo "$u" | sed 's#https://##; s#[^a-zA-Z0-9]#_#g')
            code=$(curl -sS -L -A "$UA" -o "sonda/$n.html" -w "%{http_code}" "$u" || echo ERR)
            echo "$code $(wc -c < sonda/$n.html) $u" | tee -a sonda/esito.txt
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "Sonda cinema 3" && git pull --rebase && git push

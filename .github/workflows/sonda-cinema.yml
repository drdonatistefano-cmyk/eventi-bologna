name: Sonda cinema (prova una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine di prova
        run: |
          rm -rf sonda; mkdir -p sonda
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in https://cinetecadibologna.it/programmazione/proiezione/minotaur/ https://cinetecadibologna.it/programmazione/proiezione/digger/ https://movieplayer.it/articoli/dio-ride-recensione-film-di-giovanni-veronesi_37921/; do
            n=$(echo "$u" | sed 's#https://##; s#[^a-zA-Z0-9]#_#g'); curl -sS -L -A "$UA" -o "sonda/$n.html" -w "%{http_code} $u\n" "$u" >> sonda/esito.txt; done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonda && git commit -m "Sonda cinema 5" && git pull --rebase && git push

name: Eventi e mostre automatici
on:
  schedule:
    - cron: "41 4 * * 1,4"   # lunedì e giovedì alle 5:41 ora italiana (inverno)
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova: legge le fonti ma non salva"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: { group: eventi-auto, cancel-in-progress: false }
jobs:
  eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      PROVA: ${{ inputs.prova && '--prova' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bologna
        id: bo
        run: python3 scripts/eventi_auto.py bo $PROVA
        continue-on-error: true
      - name: Milano
        id: mi
        run: python3 scripts/eventi_auto.py mi $PROVA
        continue-on-error: true
      - name: Ravenna
        id: ra
        run: python3 scripts/eventi_auto.py ra $PROVA
        continue-on-error: true
      - name: Ferrara
        id: fe
        run: python3 scripts/eventi_auto.py fe $PROVA
        continue-on-error: true
      - name: Modena
        id: mo
        run: python3 scripts/eventi_auto.py mo $PROVA
        continue-on-error: true
      - name: Forlì-Cesena
        id: fc
        run: python3 scripts/eventi_auto.py fc $PROVA
        continue-on-error: true
      - name: Firenze
        id: fi
        run: python3 scripts/eventi_auto.py fi $PROVA
        continue-on-error: true
      - name: Salva il risultato
        if: ${{ !inputs.prova }}
        run: bash scripts/salva.sh "Eventi e mostre automatici $(date +%F)" eventi.js mostre.js milano/eventi.js milano/mostre.js ravenna/eventi.js ravenna/mostre.js ferrara/eventi.js ferrara/mostre.js modena/eventi.js modena/mostre.js forli-cesena/eventi.js forli-cesena/mostre.js firenze/eventi.js firenze/mostre.js dati/auto_bo.json dati/auto_mi.json dati/auto_ra.json dati/auto_fe.json dati/auto_mo.json dati/auto_fc.json dati/auto_fi.json dati/portale_fe.json dati/portale_ra.json dati/generi_artisti.json
      - name: Segnala se qualcosa non è andato
        if: ${{ !inputs.prova && (steps.bo.outcome == 'failure' || steps.mi.outcome == 'failure') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          bash scripts/allarme.sh "Eventi automatici: errore" "Lo script scripts/eventi_auto.py non ha completato una delle due città (vedi il log del flusso «Eventi e mostre automatici» e dati/auto_bo.json, dati/auto_mi.json). I dati già pubblicati restano invariati."

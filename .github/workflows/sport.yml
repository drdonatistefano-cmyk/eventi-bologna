name: Sport automatico
on:
  schedule:
    - cron: "29 5 * * 1,4"   # lunedì e giovedì alle 6:29 ora italiana (inverno)
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova: legge le fonti ma non salva"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: { group: eventi-auto, cancel-in-progress: false }
jobs:
  sport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROVA: ${{ inputs.prova && '--prova' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bologna
        id: bo
        run: python3 scripts/sport_auto.py bo $PROVA
        continue-on-error: true
      - name: Milano
        id: mi
        run: python3 scripts/sport_auto.py mi $PROVA
        continue-on-error: true
      - name: Salva il risultato
        if: ${{ !inputs.prova }}
        run: bash scripts/salva.sh "Sport automatico $(date +%F)" sport.js milano/sport.js dati/sport_bo.json dati/sport_mi.json
      - name: Segnala se qualcosa non è andato
        if: ${{ !inputs.prova && (steps.bo.outcome == 'failure' || steps.mi.outcome == 'failure') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue list --state open --search "Sport automatico: errore in:title" --json number --jq '.[0].number' | grep -q . || \
          gh issue create --title "Sport automatico: errore" --body "Lo script scripts/sport_auto.py non ha completato una delle due città (vedi il log del flusso «Sport automatico»). Le partite già pubblicate restano invariate."

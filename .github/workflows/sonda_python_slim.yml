name: Sonda Python sulla macchina piccola (temporanea, 18/11)
# Serve solo a sapere se ubuntu-slim ha già Python 3 e git, per togliere setup-python dalla posta. Finisce sempre bene; si toglie dopo la prova.
on: { workflow_dispatch: {} }
jobs:
  slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |
          (python3 --version; which python3; python3 -c "import ssl,sqlite3,zoneinfo,csv,json,smtplib,imaplib; print('moduli ok')"; python3 -m pip --version; git --version; zoneinfo=$(python3 -c "import zoneinfo;print(zoneinfo.ZoneInfo('Europe/Rome'))"); echo "zona $zoneinfo"; time python3 -m pip install --quiet --user dnspython; python3 -c "import dns.resolver;print('dns ok')") 2>&1 || true
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          (python3 --version; python3 -c "import zoneinfo;print(zoneinfo.ZoneInfo('Europe/Rome'))"; time python3 -m pip install --quiet dnspython; python3 -c "import dns.resolver;print('dns ok')") 2>&1 || true

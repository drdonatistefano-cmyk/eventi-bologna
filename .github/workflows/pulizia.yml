name: Pulizia giornaliera
# Toglie ogni notte gli eventi passati e ricostruisce la pagina (nessun costo).
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dati/eventi.json
          git commit -m "Pulizia eventi passati $(date +%F)" || echo "nessuna modifica"
          git push

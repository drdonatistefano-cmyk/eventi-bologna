name: Versioni dei dati
# Aggiorna versioni.js (impronte dei file dei dati) quando eventi, serate, mostre o cinema cambiano con un push
# (aggiornamento del lunedì, modifiche a mano). I flussi cinema e serate lo fanno da soli prima di salvare.
on:
  push:
    branches: [main]
    paths:
      - "eventi.js"
      - "dati/indirizzi_luoghi.json"
      - "scripts/pagine_eventi.py"
      - "serate.js"
      - "mostre.js"
      - "cinema.js"
      - "milano/eventi.js"
      - "milano/serate.js"
      - "milano/mostre.js"
      - "milano/cinema.js"
      - "ravenna/*.js"
      - "ferrara/*.js"
  schedule:
    - cron: "43 * * * *"   # riserva: ogni ora, salva solo se qualcosa è cambiato (e a mezzanotte sposta i 14 giorni di eventi-presto.js)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  versioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcola le impronte
        run: python3 scripts/versioni.py
      - name: Pagine dei singoli spettacoli e mappa del sito (18/11/2026)
        run: python3 scripts/pagine_eventi.py && python3 scripts/mappa_sito.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in versioni.js index.html eventi-presto.js eventi-resto.js milano/versioni.js milano/index.html milano/eventi-presto.js milano/eventi-resto.js ravenna/versioni.js ravenna/index.html ravenna/eventi-presto.js ravenna/eventi-resto.js ferrara/versioni.js ferrara/index.html ferrara/eventi-presto.js ferrara/eventi-resto.js; do [ -e "$f" ] && git add "$f"; done; git add -A evento sitemap.xml   # 18/11: anche i due pezzi di eventi.js e le pagine dei singoli spettacoli
          git diff --cached --quiet && { echo "nessuna modifica"; exit 0; }
          git commit -m "Versioni dei dati"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1

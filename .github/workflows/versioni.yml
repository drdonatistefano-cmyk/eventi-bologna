name: Versioni dei dati
# Aggiorna versioni.js (impronte dei file dei dati) quando eventi, serate, mostre o cinema cambiano con un push
# (aggiornamento del lunedì, modifiche a mano). I flussi cinema e serate lo fanno da soli prima di salvare.
on:
  push:
    branches: [main]
    paths:
      - "eventi.js"
      - "serate.js"
      - "mostre.js"
      - "cinema.js"
      - "milano/eventi.js"
      - "milano/serate.js"
      - "milano/mostre.js"
      - "milano/cinema.js"
  schedule:
    - cron: "43 * * * *"   # riserva: ogni ora, salva solo se qualcosa è cambiato
  workflow_dispatch:
permissions:
  contents: write
jobs:
  versioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcola le impronte
        run: python3 scripts/versioni.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versioni.js milano/versioni.js
          git diff --cached --quiet && { echo "nessuna modifica"; exit 0; }
          git commit -m "Versioni dei dati"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1

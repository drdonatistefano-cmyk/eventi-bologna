name: Versioni dei dati
# Aggiorna versioni.js (impronte dei file dei dati) quando eventi, serate, mostre o cinema cambiano con un push
# (aggiornamento del lunedì, modifiche a mano). I flussi cinema e serate lo fanno da soli prima di salvare.
on:
  push:
    branches: [main]
    paths:
      - "eventi.js"
      - "dati/indirizzi_luoghi.json"
      - "scripts/pagine_eventi.py"
      - "serate.js"
      - "mostre.js"
      - "cinema.js"
      - "milano/eventi.js"
      - "milano/serate.js"
      - "milano/mostre.js"
      - "milano/cinema.js"
      - "ravenna/*.js"
      - "ferrara/*.js"
  schedule:
    - cron: "43 * * * *"   # riserva: ogni ora, salva solo se qualcosa è cambiato (e a mezzanotte sposta i 14 giorni di eventi-presto.js)
  workflow_dispatch:
permissions:
  contents: write
# 19/11/2026: un aggiornamento dei dati portava a tre salvataggi e tre pubblicazioni di fila (i dati, «Versioni dei
# dati», poi «Pagine delle città da index.html»), e GitHub annullava le pubblicazioni superate (24 in una settimana).
# Ora: se arrivano più salvataggi ravvicinati vale l'ultimo (si aspetta un minuto), e le pagine delle città si rifanno
# qui, nello stesso salvataggio; «Pagine delle città» poi non trova più niente da cambiare.
concurrency:
  group: versioni-dati
  cancel-in-progress: true
jobs:
  versioni:
    runs-on: ubuntu-latest
    steps:
      - name: Aspetta un minuto se sono arrivati più salvataggi insieme
        if: github.event_name == 'push'
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Protagonisti (campo «chi») su tutti gli eventi e incontri di tutte le città (25/11/2026)
        # gli eventi di eventi_auto.py e serate.py arrivavano senza nomi; qui li ricevono tutti, una volta sola
        run: python3 scripts/protagonisti.py --tutti
      - name: Guardiano dei nomi (REGOLA 25/11/2026) — nessuna persona in scena senza nome nel riquadro
        # scrive dati/nomi_sospetti.txt (la verifica notturna vuole 0) e avvisa qui; non ferma il salvataggio dei dati
        run: python3 scripts/protagonisti.py --sospetti --file --avvisa
      - name: Pagine delle città da index.html (prima le faceva un salvataggio a parte)
        run: python3 scripts/citta.py
      - name: Calcola le impronte
        run: python3 scripts/versioni.py
      - name: Pagine dei singoli spettacoli e mappa del sito (18/11/2026)
        run: python3 scripts/pagine_eventi.py && python3 scripts/mappa_sito.py
      - name: Le città accese sono collegate dappertutto?
        run: python3 scripts/controlla_citta.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in eventi.js incontri.js versioni.js index.html eventi-presto.js eventi-resto.js milano/versioni.js milano/index.html milano/eventi-presto.js milano/eventi-resto.js ravenna/versioni.js ravenna/index.html ravenna/eventi-presto.js ravenna/eventi-resto.js ferrara/versioni.js ferrara/index.html ferrara/eventi-presto.js ferrara/eventi-resto.js; do [ -e "$f" ] && git add "$f"; done; git add -A evento sitemap.xml milano ravenna ferrara robots.txt dati/nomi_sospetti.txt   # 18/11: anche i due pezzi di eventi.js e le pagine dei singoli spettacoli
          git diff --cached --quiet && { echo "nessuna modifica"; exit 0; }
          git commit -m "Versioni dei dati"
          # 23/11/2026: il giro delle 7:49 è fallito qui (altro salvataggio nello stesso momento): più tentativi, distanziati
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i * 10)); done; exit 1

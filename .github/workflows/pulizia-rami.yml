name: Pulizia dei rami già pubblicati
# Toglie da solo i rami claude/... che non hanno più nessun cambiamento fuori da main (tutto già pubblicato):
# Stefano non deve più cancellarli a mano (sì di Stefano 22/11/2026 17:22). Un ramo con anche un solo cambiamento
# non su main resta; se GitHub non risponde il ramo resta. Lancio a mano con togli=no: elenca soltanto.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      togli:
        description: "si = toglie i rami già pubblicati; no = elenca soltanto"
        default: "no"
permissions:
  contents: write
concurrency:
  group: pulizia-rami
  cancel-in-progress: false
jobs:
  pulizia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rami claude/ già interi su main
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          TOGLI: ${{ github.event_name == 'workflow_dispatch' && inputs.togli || 'si' }}
        run: |
          set -u
          tolti=0
          nomi=$(gh api "repos/$R/branches" --paginate -q '.[].name') || { echo "elenco dei rami non letto: non tolgo niente"; exit 0; }
          for b in $(echo "$nomi" | grep '^claude/' || true); do
            avanti=$(gh api "repos/$R/compare/main...$b" -q '.ahead_by' 2>/dev/null || echo errore)
            if [ "$avanti" = "0" ]; then
              if [ "$TOGLI" = "si" ]; then
                gh api -X DELETE "repos/$R/git/refs/heads/$b" >/dev/null && { echo "TOLTO: $b"; tolti=$((tolti+1)); } || echo "non riuscito: $b"
              else
                echo "DA TOGLIERE (prova, non tolto): $b"
              fi
            else
              echo "RESTA: $b (cambiamenti non su main: $avanti)"
            fi
          done
          echo "rami tolti: $tolti"
      # 25/11/2026 (Stefano: «voglio cancellare tutto l'inutile»): anche i rami pubblicati dopo i quali main è andato avanti
      # (caso claude/events-veloce). Un ramo si toglie solo se OGNI file che ha cambiato è uguale su main oppure main ha
      # avuto esattamente quel contenuto dopo la nascita del ramo; mai se ha un salvataggio nelle ultime 12 ore. Nel dubbio resta.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 400
      - name: Rami claude/ già pubblicati, dopo i quali main è andato avanti
        env:
          TOGLI: ${{ github.event_name == 'workflow_dispatch' && inputs.togli || 'si' }}
        run: |
          set -u
          tolti=0
          git fetch -q --depth=400 origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || { echo "rami non letti: non tolgo niente"; exit 0; }
          adesso=$(date +%s)
          for r in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/claude/); do
            b=${r#origin/}
            quando=$(git log -1 --format=%ct "$r")
            if [ $((adesso - quando)) -lt 43200 ]; then echo "RESTA: $b (salvato nelle ultime 12 ore)"; continue; fi
            base=$(git merge-base origin/main "$r" 2>/dev/null) || { echo "RESTA: $b (partenza non trovata)"; continue; }
            file=$(git diff --name-only "$base" "$r")
            [ -z "$file" ] && { echo "RESTA: $b (nessun cambiamento: ci pensa il passo sopra)"; continue; }
            tutto=si
            for f in $file; do
              bb=$(git rev-parse "$r:$f" 2>/dev/null) || { tutto=no; echo "  $b: $f tolto nel ramo"; break; }
              [ "$(git rev-parse "origin/main:$f" 2>/dev/null)" = "$bb" ] && continue
              git log --format= --raw --no-abbrev "$base..origin/main" -- "$f" | awk '{print $4}' | grep -qx "$bb" && continue
              tutto=no; echo "  $b: $f non è su main"; break
            done
            if [ "$tutto" = "si" ]; then
              if [ "$TOGLI" = "si" ]; then
                git push -q origin --delete "$b" && { echo "TOLTO (già pubblicato): $b"; tolti=$((tolti+1)); } || echo "non riuscito: $b"
              else
                echo "DA TOGLIERE (prova, non tolto): $b — tutto già pubblicato"
              fi
            else
              echo "RESTA: $b (lavoro non pubblicato)"
            fi
          done
          echo "rami pubblicati tolti: $tolti"

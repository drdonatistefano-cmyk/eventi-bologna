name: Statistiche
on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno alle 6:17 ora italiana (inverno)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  statistiche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scarica le statistiche da GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/statistiche.py
      - name: Salva il risultato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/statistiche.json dati/statistiche.md 2>/dev/null || true
          git commit -m "Statistiche $(date +%F)" || echo "nessuna modifica"
          git pull --rebase && git push
